name: CI

# Automatic runs are disabled for now; trigger manually from the Actions tab.
# To re-enable, restore:
#   push:
#   pull_request:
on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci
