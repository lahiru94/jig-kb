# Sample retailer for the jig demo (design D14). Start with `npm run up` from the repository root.
name: jig-sample-org

x-service: &service
  build:
    context: ..
    dockerfile: sample-org/Dockerfile
  image: jig-sample-org:latest
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-env: &env
  DATABASE_URL: postgres://jig:jig@postgres:5432/retail
  STOREFRONT_URL: http://storefront:4101
  ORDERS_URL: http://orders:4102
  PAYMENTS_URL: http://payments:4103
  RETURNS_URL: http://returns:4104
  LOYALTY_URL: http://loyalty:4105
  TAX_URL: http://tax:4106
  NOTIFICATIONS_URL: http://notifications:4107
  WAREHOUSE_URL: http://warehouse:4108
  LEGACY_ERP_URL: http://legacy-erp:4109

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: jig
      POSTGRES_PASSWORD: jig
      POSTGRES_DB: retail
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jig -d retail"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  storefront:
    <<: *service
    environment:
      <<: *env
      SERVICE_ENTRY: sample-org/services/storefront/src/main.ts
    ports:
      - "4101:4101"

  orders:
    <<: *service
    environment:
      <<: *env
      SERVICE_ENTRY: sample-org/services/orders/src/main.ts
    ports:
      - "4102:4102"

  payments:
    <<: *service
    environment:
      <<: *env
      SERVICE_ENTRY: sample-org/services/payments/src/main.ts
    ports:
      - "4103:4103"

  returns:
    <<: *service
    environment:
      <<: *env
      SERVICE_ENTRY: sample-org/services/returns/src/main.ts
    ports:
      - "4104:4104"

  loyalty:
    <<: *service
    environment:
      <<: *env
      SERVICE_ENTRY: sample-org/services/loyalty/src/main.ts
    ports:
      - "4105:4105"

  tax:
    <<: *service
    environment:
      <<: *env
      SERVICE_ENTRY: sample-org/services/tax/src/main.ts
    ports:
      - "4106:4106"

  notifications:
    <<: *service
    environment:
      <<: *env
      SERVICE_ENTRY: sample-org/services/notifications/src/main.ts
    ports:
      - "4107:4107"

  warehouse:
    <<: *service
    environment:
      <<: *env
      SERVICE_ENTRY: sample-org/services/warehouse/src/main.ts
    ports:
      - "4108:4108"

  legacy-erp:
    <<: *service
    depends_on: []
    environment:
      PORT: "4109"
      ERP_DB_FILE: /data/erp.sqlite
      SERVICE_ENTRY: sample-org/legacy-erp/src/erp.ts
    ports:
      - "4109:4109"
    volumes:
      - erpdata:/data

volumes:
  pgdata:
  erpdata:
